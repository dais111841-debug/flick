name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # E2E はローカルの Workers ランタイム上で実行。Google ログインと Workers AI は DEV_MODE でモックする
      - run: printf 'DEV_MODE=1\n' > .dev.vars
      - run: npm run test:e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Cloudflare secrets are not set
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != '1'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.skip != '1'
        run: npm ci
      - if: steps.gate.outputs.skip != '1'
        run: node scripts/ensure-d1.mjs
      - if: steps.gate.outputs.skip != '1'
        run: npm run build
      - if: steps.gate.outputs.skip != '1'
        run: npx wrangler d1 migrations apply flick-db --remote
      - if: steps.gate.outputs.skip != '1'
        run: npx wrangler deploy
