<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FBFCFE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flick" />
    <title>Flick</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <style>
      /* ---- 起動直後に描画される全画面スケルトン（JS 読込前でも表示） ---- */
      html { background: #FBFCFE; } html, body { margin: 0; height: 100%; }
      body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif; color: #1C2230; -webkit-font-smoothing: antialiased; }
      #boot { position: fixed; inset: 0; z-index: 15; overflow: hidden; background: #FBFCFE; transition: opacity .45s cubic-bezier(.2,.8,.2,1), filter .45s; }
      #boot.out { opacity: 0; filter: blur(8px); pointer-events: none; }
      .b-field { position: absolute; inset: -20%; background:
        radial-gradient(40% 30% at 20% 15%, #C7D9FF 0%, transparent 70%),
        radial-gradient(35% 30% at 85% 40%, #E0D3FF 0%, transparent 70%),
        radial-gradient(40% 35% at 30% 85%, #C8EEDD 0%, transparent 70%); }
      .b-wrap { position: relative; max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px 0; }
      .b-glass { background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.8); box-shadow: inset 0 1px 0 #fff, 0 8px 30px rgba(31,45,80,.07); -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%); }
      .b-top { display: flex; gap: 10px; align-items: center; }
      .b-tabs { flex: 1; height: 44px; border-radius: 999px; }
      .b-av { width: 44px; height: 44px; border-radius: 50%; }
      .b-card { height: 64px; border-radius: 22px; margin-top: 10px; }
      .b-list { margin-top: 18px; }
      .sk { position: relative; overflow: hidden; }
      .sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
        background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.95) 50%, transparent 80%);
        animation: sk 1.3s cubic-bezier(.4,0,.2,1) infinite; }
      .b-line { position: absolute; left: 18px; top: 18px; height: 12px; border-radius: 6px; background: rgba(28,34,48,.07); }
      .b-line.s { top: 38px; height: 9px; background: rgba(28,34,48,.045); }
      @keyframes sk { to { transform: translateX(100%); } }
      .b-dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 12px calc(env(safe-area-inset-bottom) + 12px); }
      .b-composer { max-width: 616px; margin: 0 auto; border-radius: 28px; display: flex; align-items: flex-end; padding: 6px 6px 6px 18px; }
      #boot-memo { flex: 1; border: 0; outline: 0; resize: none; background: transparent; font: inherit; font-size: 17px; line-height: 24px; padding: 10px 0; color: inherit; height: 24px; max-height: 40vh; }
      #boot-memo::placeholder { color: #8A93A6; }
      .b-btn { width: 44px; height: 44px; border-radius: 50%; background: rgba(28,34,48,.05); }
      @media (prefers-reduced-motion: reduce) { .sk::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-busy="true">
      <div class="b-field"></div>
      <div class="b-wrap">
        <div class="b-top"><div class="b-tabs b-glass sk"></div><div class="b-av b-glass sk"></div></div>
        <div class="b-list">
          <div class="b-card b-glass sk"><span class="b-line" style="width:58%"></span><span class="b-line s" style="width:30%"></span></div>
          <div class="b-card b-glass sk"><span class="b-line" style="width:72%"></span><span class="b-line s" style="width:22%"></span></div>
          <div class="b-card b-glass sk"><span class="b-line" style="width:44%"></span><span class="b-line s" style="width:34%"></span></div>
          <div class="b-card b-glass sk"><span class="b-line" style="width:66%"></span><span class="b-line s" style="width:26%"></span></div>
          <div class="b-card b-glass sk"><span class="b-line" style="width:50%"></span><span class="b-line s" style="width:30%"></span></div>
          <div class="b-card b-glass sk"><span class="b-line" style="width:62%"></span><span class="b-line s" style="width:20%"></span></div>
        </div>
      </div>
      <div class="b-dock">
        <div class="b-composer b-glass">
          <!-- JS の読み込みを待たずに入力できる本物の入力欄。アプリ起動時に内容とフォーカスを引き継ぐ -->
          <textarea id="boot-memo" rows="1" placeholder="メモ" aria-label="メモ" enterkeyhint="send" autofocus></textarea>
          <div class="b-btn"></div>
        </div>
      </div>
    </div>
    <script>
      try { var d = localStorage.getItem('flick.v1.draft'); if (d) document.getElementById('boot-memo').value = d; } catch (e) {}
      document.getElementById('boot-memo').focus();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
